name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15          # if GitHub retires this image, switch to the newest macos-XX label
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild -project OfflinePlayer.xcodeproj -scheme OfflinePlayer \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/OfflinePlayer.app Payload/
          zip -qr OfflinePlayer.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: OfflinePlayer-ipa
          path: OfflinePlayer.ipa
      - name: Show compile errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -25 | cut -c1-400 | sed 's/^/::error::/' || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
