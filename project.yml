name: OfflinePlayer
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  Swifter:
    url: https://github.com/httpswift/swifter
    from: 1.5.0
targets:
  OfflinePlayer:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: Swifter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.offlineplayer.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Offline Player
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: Used to receive files from your computer over Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
